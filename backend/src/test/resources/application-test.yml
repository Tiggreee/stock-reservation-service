spring:
  datasource:
    hikari:
      connection-timeout: 15000
      maximum-pool-size: 16
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    consumer:
      auto-offset-reset: earliest

inventory:
  outbox:
    poll-interval-ms: 250
  kafka:
    retry:
      attempts: 3
      initial-interval-ms: 700
      multiplier: 3.0
      max-interval-ms: 6000

logging:
  level:
    org.apache.kafka: WARN
    org.testcontainers: INFO
